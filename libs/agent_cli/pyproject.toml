[project]
name = "sdo-agent-cli"
version = "0.1.0"
description = "Structured agentshim turns for SDO agents"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "agentshim>=0.7.0,<0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["libs/agent_cli"]
